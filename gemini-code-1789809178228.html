            roomNumber: `${bNo}: ${roomSuffix}`,
            buildingId: bId,
            buildingName: bName,

    // --- 3D ENGINE ---
    function CampusTwin3D({ onSelectBuilding, selectedBuilding, selectedCategory, timeOffsetMultiplier, activeEmergency }) {
      const containerRef = useRef(null);

      useEffect(() => {
        const container = containerRef.current;
        if (!container) return;

        const w = container.clientWidth || 700;
        const h = container.clientHeight || 500;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x030712);
        scene.fog = new THREE.FogExp2(0x030712, 0.0011);

        const camera = new THREE.PerspectiveCamera(40, w / h, 1, 3000);
        let spherical = { radius: 460, theta: 0.82, phi: 1.12 };

        const updateCameraPos = () => {
          spherical.phi = Math.max(0.15, Math.min(Math.PI / 2.05, spherical.phi));
          camera.position.x = spherical.radius * Math.sin(spherical.phi) * Math.sin(spherical.theta);
          camera.position.y = spherical.radius * Math.cos(spherical.phi);
          camera.position.z = spherical.radius * Math.sin(spherical.phi) * Math.cos(spherical.theta);
          camera.lookAt(0, 30, 0);
        };
        updateCameraPos();

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setSize(w, h);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0x0e172a, 3.8));
        const keyLight = new THREE.DirectionalLight(0x00f5ff, 2.5);
        keyLight.position.set(240, 480, 200);
        scene.add(keyLight);

        const fillLight = new THREE.DirectionalLight(0xa855f7, 1.6);
        fillLight.position.set(-240, 240, -200);
        scene.add(fillLight);

        const pedestalGeo = new THREE.CylinderGeometry(400, 410, 8, 64);
        const pedestalMat = new THREE.MeshStandardMaterial({ color: 0x080e1a, roughness: 0.85, metalness: 0.15 });
        const pedestal = new THREE.Mesh(pedestalGeo, pedestalMat);
        pedestal.position.y = -4;
        scene.add(pedestal);

        const edgeRingGeo = new THREE.RingGeometry(398, 402, 64);
        const edgeRingMat = new THREE.MeshBasicMaterial({ color: 0x00f5ff, side: THREE.DoubleSide, transparent: true, opacity: 0.35 });
        const edgeRing = new THREE.Mesh(edgeRingGeo, edgeRingMat);
        edgeRing.rotation.x = -Math.PI / 2;
        edgeRing.position.y = 0.2;
        scene.add(edgeRing);

        const refLon = 75.7055;
        const refLat = 31.2555;
        const scale = 52000;

        const to3D = (lon, lat) => ({
          x: (lon - refLon) * scale,
          y: (lat - refLat) * scale
        });

        campusRoads.forEach((road) => {
          const points3D = road.coordinates.map(pt => {
            const p = to3D(pt[0], pt[1]);
            return new THREE.Vector3(p.x, 0.4, -p.y);
          });
          const curve = new THREE.CatmullRomCurve3(points3D);
          const roadGeo = new THREE.TubeGeometry(curve, 64, road.width * 0.45, 8, false);
          roadGeo.scale(1, 0.08, 1);
          scene.add(new THREE.Mesh(roadGeo, new THREE.MeshStandardMaterial({ color: road.color, roughness: 0.85, metalness: 0.1 })));
        });

        campusPedestrianPaths.forEach((path) => {
          const pathPoints = path.coordinates.map(pt => {
            const p = to3D(pt[0], pt[1]);
            return new THREE.Vector3(p.x, 0.5, -p.y);
          });
          const curve = new THREE.CatmullRomCurve3(pathPoints);
          const pathGeo = new THREE.TubeGeometry(curve, 32, 1.8, 6, false);
          pathGeo.scale(1, 0.08, 1);
          scene.add(new THREE.Mesh(pathGeo, new THREE.MeshStandardMaterial({ color: 0x10b981, emissive: 0x10b981, emissiveIntensity: 0.35, transparent: true, opacity: 0.65 })));
        });

        campusEnvironmentObjects.forEach((obj) => {
          if (obj.type === "tree") {
            const p = to3D(obj.coordinates[0], obj.coordinates[1]);
            const treeGroup = new THREE.Group();
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 1.2, 8, 5), new THREE.MeshStandardMaterial({ color: 0x1e293b }));
            trunk.position.y = 4;
            treeGroup.add(trunk);
            const foliage = new THREE.Mesh(new THREE.ConeGeometry(6 * obj.scale, 14 * obj.scale, 5), new THREE.MeshStandardMaterial({ color: 0x059669, roughness: 0.4, emissive: 0x059669, emissiveIntensity: 0.2 }));
            foliage.position.y = 12 * obj.scale;
            treeGroup.add(foliage);
            treeGroup.position.set(p.x, 0, -p.y);
            scene.add(treeGroup);
          }
        });

        const meshes = [];

        campusFeatures.forEach((feat) => {
          const shape = new THREE.Shape();
          let centerX = 0, centerY = 0;
          feat.coordinates.forEach((pt, i) => {
            const p = to3D(pt[0], pt[1]);
            centerX += p.x;
            centerY += p.y;
            if (i === 0) shape.moveTo(p.x, p.y);
            else shape.lineTo(p.x, p.y);
          });
          centerX /= feat.coordinates.length;
          centerY /= feat.coordinates.length;

          const isParking = feat.category === "parking";
          const height = isParking ? 3.5 : feat.levels * 7.5;
          const extrudeSettings = {
            depth: height,
            bevelEnabled: !isParking,
            bevelSegments: 2,
            steps: 1,
            bevelSize: 0.6,
            bevelThickness: 0.6
          };

          const geo = new THREE.ExtrudeGeometry(shape, extrudeSettings);
          geo.rotateX(-Math.PI / 2);

          const isEmergencyBlock = activeEmergency && activeEmergency.buildingId === feat.id;
          const isSelected = selectedBuilding && selectedBuilding.id === feat.id;
          const isCategoryMatch = selectedCategory === "all" || feat.category === selectedCategory;

          const predictedOcc = Math.min(feat.capacity, Math.round(feat.baseOccupancy * timeOffsetMultiplier));
          const pct = predictedOcc / feat.capacity;
          const defaultHexColor = isParking ? 0xf59e0b : (pct > 0.85 ? 0xf43f5e : pct > 0.65 ? 0xf59e0b : 0x00f5ff);
          const hexColor = isEmergencyBlock ? 0xe11d48 : defaultHexColor;

          const mat = new THREE.MeshStandardMaterial({
            color: isEmergencyBlock ? 0xff0033 : (isSelected ? 0xffffff : (isCategoryMatch ? hexColor : 0x1e293b)),
            metalness: isCategoryMatch ? 0.35 : 0.1,
            roughness: 0.25,
            transparent: true,
            opacity: isEmergencyBlock ? 0.95 : (isSelected ? 0.98 : (isCategoryMatch ? 0.88 : 0.15)),
            emissive: isEmergencyBlock ? 0xff0033 : (isSelected ? 0x00f5ff : (isCategoryMatch ? hexColor : 0x000000)),
            emissiveIntensity: isEmergencyBlock ? 0.85 : (isSelected ? 0.6 : (isCategoryMatch ? 0.3 : 0.0))
          });

          const mesh = new THREE.Mesh(geo, mat);
          mesh.userData = { ...feat, currentOccupancy: predictedOcc };
          scene.add(mesh);

          const wireGeo = new THREE.EdgesGeometry(geo);
          const wireMat = new THREE.LineBasicMaterial({
            color: isEmergencyBlock ? 0xffffff : (isSelected ? 0xffffff : (isCategoryMatch ? hexColor : 0x334155)),
            transparent: true,
            opacity: isEmergencyBlock ? 1.0 : (isSelected ? 0.95 : (isCategoryMatch ? 0.6 : 0.1))
          });
          mesh.add(new THREE.LineSegments(wireGeo, wireMat));

          if (feat.hasCanopy) {
            const canopyGeo = new THREE.BoxGeometry(28, 2.2, 16);
            const canopyMat = new THREE.MeshStandardMaterial({
              color: isEmergencyBlock ? 0xff0033 : (isSelected ? 0x00f5ff : 0x475569),
              metalness: 0.85,
              roughness: 0.2
            });
            const canopyMesh = new THREE.Mesh(canopyGeo, canopyMat);
            canopyMesh.position.set(centerX + 3, height + 4.5, -centerY - 4);
            canopyMesh.rotation.x = -0.08;
            canopyMesh.rotation.y = 0.12;
            mesh.add(canopyMesh);

            const trussGeo = new THREE.EdgesGeometry(canopyGeo);
            const trussMat = new THREE.LineBasicMaterial({ color: isEmergencyBlock ? 0xffffff : 0x00f5ff, linewidth: 2 });
            canopyMesh.add(new THREE.LineSegments(trussGeo, trussMat));
          }

          meshes.push(mesh);
        });

        let isDragging = false;
        let prevMouse = { x: 0, y: 0 };

        const onMouseDown = (e) => {
          isDragging = true;
          prevMouse = { x: e.clientX, y: e.clientY };
        };

        const onMouseMove = (e) => {
          if (!isDragging) return;
          const dx = e.clientX - prevMouse.x;
          const dy = e.clientY - prevMouse.y;
          spherical.theta -= dx * 0.006;
          spherical.phi -= dy * 0.006;
          updateCameraPos();
          prevMouse = { x: e.clientX, y: e.clientY };
        };

        const onMouseUp = (e) => {
          if (!isDragging) return;
          isDragging = false;
          const rect = renderer.domElement.getBoundingClientRect();
          const mouse = new THREE.Vector2(
            ((e.clientX - rect.left) / rect.width) * 2 - 1,
            -((e.clientY - rect.top) / rect.height) * 2 + 1
          );
          const raycaster = new THREE.Raycaster();
          raycaster.setFromCamera(mouse, camera);
          const hits = raycaster.intersectObjects(meshes);
          if (hits.length > 0) {
            onSelectBuilding(hits[0].object.userData);
          }
        };

        const onWheel = (e) => {
          e.preventDefault();
          spherical.radius += e.deltaY * 0.4;
          spherical.radius = Math.max(120, Math.min(750, spherical.radius));
          updateCameraPos();
        };

        const dom = renderer.domElement;
        dom.addEventListener('mousedown', onMouseDown);
        window.addEventListener('mousemove', onMouseMove);
        window.addEventListener('mouseup', onMouseUp);
        dom.addEventListener('wheel', onWheel);

        let animId;
        const render = () => {
          animId = requestAnimationFrame(render);
          renderer.render(scene, camera);
        };
        render();

        const onResize = () => {
          if (!container) return;
          camera.aspect = container.clientWidth / container.clientHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(container.clientWidth, container.clientHeight);
        };
        window.addEventListener('resize', onResize);

        return () => {
          cancelAnimationFrame(animId);
          window.removeEventListener('resize', onResize);
          dom.removeEventListener('mousedown', onMouseDown);
          window.removeEventListener('mousemove', onMouseMove);
          window.removeEventListener('mouseup', onMouseUp);
          dom.removeEventListener('wheel', onWheel);
          if (container.contains(dom)) container.removeChild(dom);
          renderer.dispose();
        };
      }, [selectedBuilding, selectedCategory, timeOffsetMultiplier, activeEmergency]);

      return (
        <div className="relative w-full h-[500px] rounded-2xl overflow-hidden glass-hull">
          <div ref={containerRef} className="w-full h-full cursor-grab active:cursor-grabbing" />
          <div className="absolute top-4 left-4 pointer-events-none flex flex-col gap-1 z-10">
            <Badge variant="cyan">3D PREDICTIVE ECOSYSTEM</Badge>
            <span className="text-[11px] font-mono text-slate-400">Reflecting selected predictive time offset</span>
          </div>
        </div>
      );
    }

    // --- 2D CARTOGRAPHIC SCHEMATIC ---
    function CampusTwin2D({ onSelectBuilding, selectedBuilding, selectedCategory, timeOffsetMultiplier, activeEmergency }) {
      const minLon = 75.7010, maxLon = 75.7100;
      const minLat = 31.2505, maxLat = 31.2600;
      const svgW = 800, svgH = 500;

      const project = (lon, lat) => {
        const x = ((lon - minLon) / (maxLon - minLon)) * (svgW - 80) + 40;
        const y = svgH - (((lat - minLat) / (maxLat - minLat)) * (svgH - 80) + 40);
        return { x, y };
      };

      return (
        <div className="relative w-full h-[500px] rounded-2xl overflow-hidden glass-hull flex items-center justify-center">
          <svg viewBox={`0 0 ${svgW} ${svgH}`} className="w-full h-full select-none">
            {campusRoads.map(road => {
              const dStr = road.coordinates.map((pt, i) => {
                const p = project(pt[0], pt[1]);
                return `${i === 0 ? 'M' : 'L'} ${p.x} ${p.y}`;
              }).join(" ");
              return (
                <g key={road.id}>
                  <path d={dStr} stroke="#1e293b" strokeWidth={road.width * 1.5} fill="none" strokeLinecap="round" />
                  <path d={dStr} stroke="rgba(0, 245, 255, 0.4)" strokeWidth="1.5" strokeDasharray="6 4" fill="none" />
                </g>
              );
            })}

            {campusPedestrianPaths.map((path, idx) => {
              const dStr = path.coordinates.map((pt, i) => {
                const p = project(pt[0], pt[1]);
                return `${i === 0 ? 'M' : 'L'} ${p.x} ${p.y}`;
              }).join(" ");
              return (
                <path key={`path-2d-${idx}`} d={dStr} stroke="#10b981" strokeWidth="3" strokeDasharray="4 3" fill="none" opacity="0.75" />
              );
            })}

            {campusFeatures.map((feat) => {
              const pointsStr = feat.coordinates.map(pt => {
                const p = project(pt[0], pt[1]);
                return `${p.x},${p.y}`;
              }).join(" ");

              const isEmergencyBlock = activeEmergency && activeEmergency.buildingId === feat.id;
              const isSelected = selectedBuilding && selectedBuilding.id === feat.id;
              const isCategoryMatch = selectedCategory === "all" || feat.category === selectedCategory;

              const predictedOcc = Math.min(feat.capacity, Math.round(feat.baseOccupancy * timeOffsetMultiplier));
              const isParking = feat.category === "parking";
              const pct = predictedOcc / feat.capacity;
              const defaultColor = isParking ? '#f59e0b' : (pct > 0.85 ? '#f43f5e' : pct > 0.65 ? '#f59e0b' : '#00f5ff');
              const color = isEmergencyBlock ? '#e11d48' : defaultColor;

              const avgX = feat.coordinates.reduce((acc, pt) => acc + project(pt[0], pt[1]).x, 0) / feat.coordinates.length;
              const avgY = feat.coordinates.reduce((acc, pt) => acc + project(pt[0], pt[1]).y, 0) / feat.coordinates.length;

              const displayData = { ...feat, currentOccupancy: predictedOcc };

              return (
                <g key={feat.id} onClick={() => onSelectBuilding(displayData)} className={`cursor-pointer transition-all duration-300 ${isCategoryMatch ? 'opacity-100' : 'opacity-20'}`}>
                  <polygon
                    points={pointsStr}
                    fill={color}
                    fillOpacity={isEmergencyBlock ? "0.85" : (isSelected ? "0.65" : (isCategoryMatch ? "0.32" : "0.08"))}
                    stroke={isEmergencyBlock ? "#ffffff" : (isSelected ? "#ffffff" : color)}
                    strokeWidth={isEmergencyBlock ? "3.5" : (isSelected ? "2.5" : "1.5")}
                  />
                  {feat.hasCanopy && (
                    <rect
                      x={avgX - 16}
                      y={avgY - 22}
                      width="32"
                      height="8"
                      fill="none"
                      stroke={isEmergencyBlock ? "#ffffff" : "#00f5ff"}
                      strokeWidth="1.2"
                      strokeDasharray="2 2"
                      opacity="0.9"
                    />
                  )}
                  {isCategoryMatch && (
                    <g>
                      <circle cx={avgX} cy={avgY} r="3.5" fill="#ffffff" opacity={isSelected ? "1" : "0.6"} />
                      <text x={avgX} y={avgY - 12} fill="#f8fafc" fontSize="11" fontFamily="Plus Jakarta Sans" fontWeight="600" textAnchor="middle">
                        {feat.subBlocks ? feat.subBlocks : feat.name}
                      </text>
                      <text x={avgX} y={avgY + 16} fill={color} fontSize="10" fontFamily="JetBrains Mono" fontWeight="700" textAnchor="middle">
                        {isEmergencyBlock ? 'LOCKDOWN' : `${Math.round(pct * 100)}%`}
                      </text>
                    </g>
                  )}
                </g>
              );
            })}
          </svg>
          <div className="absolute top-4 left-4 pointer-events-none flex flex-col gap-1 z-10">
            <Badge variant="cyan">2D PREDICTIVE PLAN</Badge>
            <span className="text-[11px] font-mono text-slate-400">Reflecting selected predictive time offset</span>
          </div>
        </div>
      );
    }
